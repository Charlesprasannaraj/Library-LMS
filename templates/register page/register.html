<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Page: Member Registration -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | BookVerse Library</title>
        <link rel="stylesheet" href="../../css/theme.css">
     <link rel="stylesheet" href="./register.css">

</head>


<body>


    <main class="login-page register-page">


        <!-- Section: Registration Background -->

        <div class="auth-background">


            <!-- Section: Auth Navigation -->

            <div class="auth-menu">

                <button
                    type="button"
                    onclick="toggleMenu()"
                    class="menu-button"
                >
                    ⋮
                </button>


                <div
                    id="menuBox"
                    class="menu-box"
                >

                    <a href="/index.html">
                        Home
                    </a>

                    <a href="../login page/login.html">
                        Login
                    </a>

                </div>

            </div>


            <!-- Section: Registration Form -->

            <div class="auth-form">

                <p class="small-title">
                    JOIN BOOKVERSE
                </p>


                <h1>
                    Create Your Account
                </h1>


                <p class="login-text">
                    Create your account and begin your reading journey.
                </p>


                <form id="registerForm" novalidate>


                    <div class="input-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            minlength="2"
                            maxlength="80"
                            aria-describedby="nameError"
                            required
                        >
                        <small class="field-error" id="nameError" aria-live="polite"></small>

                    </div>


                    

                    <div class="input-group">

                        <label for="mobileNumber">
                            Mobile Number
                        </label>

                        <input
                            type="tel"
                            id="mobileNumber"
                            placeholder="Enter your mobile number"
                            autocomplete="tel"
                            inputmode="tel"
                            maxlength="20"
                            aria-describedby="mobileNumberError"
                            required
                        >
                        <small class="field-error" id="mobileNumberError" aria-live="polite"></small>

                    </div>


                    

                    <div class="input-group">

                        <label for="address">
                            Address
                        </label>

                        <input
                            type="text"
                            id="address"
                            placeholder="Enter your address"
                            autocomplete="street-address"
                            minlength="5"
                            maxlength="250"
                            aria-describedby="addressError"
                            required
                        >
                        <small class="field-error" id="addressError" aria-live="polite"></small>

                    </div>


                    <div class="input-group">

                        <label for="registerEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="registerEmail"
                            placeholder="Enter your email"
                            autocomplete="email"
                            maxlength="254"
                            aria-describedby="registerEmailError"
                            required
                        >
                        <small class="field-error" id="registerEmailError" aria-live="polite"></small>

                    </div>


                    <div class="input-group">

                        <label for="registerPassword">
                            Password
                        </label>

                        <div class="password-field">
                            <input
                                type="password"
                                id="registerPassword"
                                placeholder="Create a password"
                                autocomplete="new-password"
                                aria-describedby="passwordHint passwordError"
                                required
                            >
                            <button class="password-toggle" type="button" data-password-toggle="registerPassword" aria-label="Show password" aria-pressed="false">Show</button>
                        </div>
                        <small class="field-hint" id="passwordHint">Use at least 8 characters with uppercase, lowercase, and a number.</small>
                        <div class="password-strength" role="progressbar" aria-label="Password strength" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0" aria-live="polite">
                            <span class="strength-track"><span class="strength-fill" id="strengthFill"></span></span>
                            <span class="strength-label" id="strengthLabel">Password strength</span>
                        </div>
                        <small class="field-error" id="passwordError" aria-live="polite"></small>

                    </div>


                    <div class="input-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <div class="password-field">
                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm your password"
                                autocomplete="new-password"
                                aria-describedby="confirmPasswordError"
                                required
                            >
                            <button class="password-toggle" type="button" data-password-toggle="confirmPassword" aria-label="Show password" aria-pressed="false">Show</button>
                        </div>
                        <small class="field-error" id="confirmPasswordError" aria-live="polite"></small>

                    </div>


                    <button
                        type="submit"
                        class="login-button"
                    >
                        CREATE ACCOUNT
                    </button>


                </form>


                <div class="register-link">

                    <p>
                        Already have an account?
                    </p>

                    <a href="../login page/login.html">
                        Back to Login
                    </a>

                </div>

            </div>

        </div>

    </main>


        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="./register.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

</body>

</html>

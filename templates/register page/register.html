<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | BookVerse Library</title>
     <link rel="stylesheet" href="./register.css">

</head>


<body>


    <main class="login-page register-page">


        <!-- Theme Image -->

        <div class="auth-background">


            <!-- Navigation -->

            <div class="auth-menu">

                <button
                    type="button"
                    onclick="toggleMenu()"
                    class="menu-button"
                >
                    ⋮
                </button>


                <div
                    id="menuBox"
                    class="menu-box"
                >

                    <a href="/index.html">
                        Home
                    </a>

                    <a href="../login page/login.html">
                        Login
                    </a>

                </div>

            </div>


            <!-- Register Form -->

            <div class="auth-form">

                <p class="small-title">
                    JOIN BOOKVERSE
                </p>


                <h1>
                    Create Your Account
                </h1>


                <p class="login-text">
                    Create your account and begin your reading journey.
                </p>


                <form id="registerForm">


                    <div class="input-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    

                    <div class="input-group">

                        <label for="mobileNumber">
                            Mobile Number
                        </label>

                        <input
                            type="number"
                            id="mobileNumber"
                            placeholder="Enter your Number"
                            required
                        >

                    </div>


                    

                    <div class="input-group">

                        <label for="Address">
                            Address
                        </label>

                        <input
                            type="Address"
                            id="address"
                            placeholder="Enter your Address"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="registerEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="registerEmail"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="registerPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Create a password"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="login-button"
                    >
                        CREATE ACCOUNT
                    </button>


                </form>


                <div class="register-link">

                    <p>
                        Already have an account?
                    </p>

                    <a href="../login page/login.html">
                        Back to Login
                    </a>

                </div>

            </div>

        </div>

    </main>


    <script src="./register.js"></script>

</body>

</html>
